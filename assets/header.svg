<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="NChiranjeevi - Security Analyst, SOC Operations">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04070d"/><stop offset="1" stop-color="#0b1426"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.22"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="round"><rect width="1000" height="280" rx="14"/></clipPath>
<clipPath id="typeclip"><rect x="311" y="192" width="0" height="30"><animate attributeName="width" values="0;400;400;0" keyTimes="0;0.4;0.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#round)" font-family="'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace">
<rect width="1000" height="280" fill="url(#bg)"/>
<rect width="1000" height="280" fill="url(#grid)"/>
<rect x="0" y="-40" width="1000" height="40" fill="url(#scan)"><animate attributeName="y" from="-40" to="280" dur="5s" repeatCount="indefinite"/></rect>
