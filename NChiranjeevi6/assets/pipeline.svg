<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Alert pipeline" font-family="'Courier New',Consolas,Menlo,monospace"><defs><linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd24a"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e63900"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a130c" stroke-width=".6"/></pattern></defs><rect width="1000" height="160" rx="8" fill="#0d0605" stroke="#3a1a10"/><rect width="1000" height="160" rx="8" fill="url(#grid)"/>
<line x1="100" y1="70" x2="900" y2="70" stroke="#3a1a10" stroke-width="2"/><line x1="100" y1="70" x2="900" y2="70" stroke="#e63900" stroke-width="2" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" repeatCount="indefinite"/></line>
<text x="16" y="24" font-size="11" fill="#ffb000">ALERT PIPELINE // HOW AN ALERT GETS CLOSED</text><circle cx="100" cy="70" r="22" fill="none" stroke="#ff6a00" opacity="0"><animate attributeName="r" values="22;38" dur="4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle cx="100" cy="70" r="22" fill="#140a07" stroke="#ff6a00" stroke-width="2" filter="url(#glow)"/><text x="100" y="76" font-size="16" font-weight="bold" fill="#ffd24a" text-anchor="middle">1</text>
<text x="100" y="116" font-size="13" font-weight="bold" fill="#f5e6dc" text-anchor="middle">DETECT</text><text x="100" y="136" font-size="11" fill="#a8826f" text-anchor="middle">SIEM alert fires</text><circle cx="300" cy="70" r="22" fill="none" stroke="#ff6a00" opacity="0"><animate attributeName="r" values="22;38" dur="4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="70" r="22" fill="#140a07" stroke="#ff6a00" stroke-width="2" filter="url(#glow)"/><text x="300" y="76" font-size="16" font-weight="bold" fill="#ffd24a" text-anchor="middle">2</text>
<text x="300" y="116" font-size="13" font-weight="bold" fill="#f5e6dc" text-anchor="middle">ANALYZE</text><text x="300" y="136" font-size="11" fill="#a8826f" text-anchor="middle">Enrich + correlate</text><circle cx="500" cy="70" r="22" fill="none" stroke="#ff6a00" opacity="0"><animate attributeName="r" values="22;38" dur="4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="1.6s" repeatCount="indefinite"/></circle>
<circle cx="500" cy="70" r="22" fill="#140a07" stroke="#ff6a00" stroke-width="2" filter="url(#glow)"/><text x="500" y="76" font-size="16" font-weight="bold" fill="#ffd24a" text-anchor="middle">3</text>
<text x="500" y="116" font-size="13" font-weight="bold" fill="#f5e6dc" text-anchor="middle">TRIAGE</text><text x="500" y="136" font-size="11" fill="#a8826f" text-anchor="middle">Severity + scope</text><circle cx="700" cy="70" r="22" fill="none" stroke="#ff6a00" opacity="0"><animate attributeName="r" values="22;38" dur="4s" begin="2.4000000000000004s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="2.4000000000000004s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="70" r="22" fill="#140a07" stroke="#ff6a00" stroke-width="2" filter="url(#glow)"/><text x="700" y="76" font-size="16" font-weight="bold" fill="#ffd24a" text-anchor="middle">4</text>
<text x="700" y="116" font-size="13" font-weight="bold" fill="#f5e6dc" text-anchor="middle">CONTAIN</text><text x="700" y="136" font-size="11" fill="#a8826f" text-anchor="middle">Isolate / reset / patch</text><circle cx="900" cy="70" r="22" fill="none" stroke="#ff6a00" opacity="0"><animate attributeName="r" values="22;38" dur="4s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="4s" begin="3.2s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="70" r="22" fill="#140a07" stroke="#ff6a00" stroke-width="2" filter="url(#glow)"/><text x="900" y="76" font-size="16" font-weight="bold" fill="#ffd24a" text-anchor="middle">5</text>
<text x="900" y="116" font-size="13" font-weight="bold" fill="#f5e6dc" text-anchor="middle">CLOSE</text><text x="900" y="136" font-size="11" fill="#a8826f" text-anchor="middle">Document + escalate</text>
<circle r="6" fill="#ffd24a" filter="url(#glow)"><animateMotion path="M100 70 L900 70" dur="6s" repeatCount="indefinite"/></circle></svg>