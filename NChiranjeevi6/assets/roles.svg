<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a130c" stroke-width=".6"/></pattern></defs><g transform="translate(10 10)"><rect width="188" height="190" rx="8" fill="#140a07" stroke="#ff6a00" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.3;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect><rect width="188" height="3" rx="1.5" fill="url(#fire)"/><text x="16" y="38" font-size="26" font-weight="bold" fill="url(#fire)" filter="url(#glow)">01</text><circle cx="164" cy="30" r="5" fill="#ffb000"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle><text x="16" y="72" font-size="15" font-weight="bold" fill="#f5e6dc">SECURITY</text><text x="16" y="91" font-size="15" font-weight="bold" fill="#f5e6dc">ENGINEER</text><line x1="16" x2="172" y1="104" y2="104" stroke="#3a1a10"/><text x="16" y="126" font-size="11.5" fill="#a8826f">Security controls,</text><text x="16" y="144" font-size="11.5" fill="#a8826f">monitoring, and</text><text x="16" y="162" font-size="11.5" fill="#a8826f">protection</text></g><g transform="translate(208 10)"><rect width="188" height="190" rx="8" fill="#140a07" stroke="#ff6a00" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.3;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></rect><rect width="188" height="3" rx="1.5" fill="url(#fire)"/><text x="16" y="38" font-size="26" font-weight="bold" fill="url(#fire)" filter="url(#glow)">02</text><circle cx="164" cy="30" r="5" fill="#ffb000"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle><text x="16" y="72" font-size="15" font-weight="bold" fill="#f5e6dc">CYBERSECURITY</text><text x="16" y="91" font-size="15" font-weight="bold" fill="#f5e6dc">ENGINEER</text><line x1="16" x2="172" y1="104" y2="104" stroke="#3a1a10"/><text x="16" y="126" font-size="11.5" fill="#a8826f">Broad security</text><text x="16" y="144" font-size="11.5" fill="#a8826f">engineering and</text><text x="16" y="162" font-size="11.5" fill="#a8826f">defense</text></g><g transform="translate(406 10)"><rect width="188" height="190" rx="8" fill="#140a07" stroke="#ff6a00" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.3;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></rect><rect width="188" height="3" rx="1.5" fill="url(#fire)"/><text x="16" y="38" font-size="26" font-weight="bold" fill="url(#fire)" filter="url(#glow)">03</text><circle cx="164" cy="30" r="5" fill="#ffb000"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle><text x="16" y="72" font-size="15" font-weight="bold" fill="#f5e6dc">SYSTEMS SECURITY</text><text x="16" y="91" font-size="15" font-weight="bold" fill="#f5e6dc">ENGINEER</text><line x1="16" x2="172" y1="104" y2="104" stroke="#3a1a10"/><text x="16" y="126" font-size="11.5" fill="#a8826f">Operating systems,</text><text x="16" y="144" font-size="11.5" fill="#a8826f">hardening, and</text><text x="16" y="162" font-size="11.5" fill="#a8826f">endpoint security</text></g><g transform="translate(604 10)"><rect width="188" height="190" rx="8" fill="#140a07" stroke="#ff6a00" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.3;1" dur="6s" begin="3.5999999999999996s" repeatCount="indefinite"/></rect><rect width="188" height="3" rx="1.5" fill="url(#fire)"/><text x="16" y="38" font-size="26" font-weight="bold" fill="url(#fire)" filter="url(#glow)">04</text><circle cx="164" cy="30" r="5" fill="#ffb000"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="1.2000000000000002s" repeatCount="indefinite"/></circle><text x="16" y="72" font-size="15" font-weight="bold" fill="#f5e6dc">NETWORK SECURITY</text><text x="16" y="91" font-size="15" font-weight="bold" fill="#f5e6dc">ENGINEER</text><line x1="16" x2="172" y1="104" y2="104" stroke="#3a1a10"/><text x="16" y="126" font-size="11.5" fill="#a8826f">Firewalls, TCP/IP,</text><text x="16" y="144" font-size="11.5" fill="#a8826f">network defense, and</text><text x="16" y="162" font-size="11.5" fill="#a8826f">traffic analysis</text></g><g transform="translate(802 10)"><rect width="188" height="190" rx="8" fill="#140a07" stroke="#ff6a00" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.3;1" dur="6s" begin="4.8s" repeatCount="indefinite"/></rect><rect width="188" height="3" rx="1.5" fill="url(#fire)"/><text x="16" y="38" font-size="26" font-weight="bold" fill="url(#fire)" filter="url(#glow)">05</text><circle cx="164" cy="30" r="5" fill="#ffb000"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle><text x="16" y="72" font-size="15" font-weight="bold" fill="#f5e6dc">IAM</text><text x="16" y="91" font-size="15" font-weight="bold" fill="#f5e6dc">ENGINEER</text><line x1="16" x2="172" y1="104" y2="104" stroke="#3a1a10"/><text x="16" y="126" font-size="11.5" fill="#a8826f">Identity lifecycle,</text><text x="16" y="144" font-size="11.5" fill="#a8826f">authentication,</text><text x="16" y="162" font-size="11.5" fill="#a8826f">authorization, and</text><text x="16" y="180" font-size="11.5" fill="#a8826f">access controls</text></g></svg>