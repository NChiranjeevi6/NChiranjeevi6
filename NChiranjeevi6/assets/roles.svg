<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Five target roles" font-family="'Courier New',Consolas,Menlo,monospace"><defs><linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd24a"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e63900"/></linearGradient>
