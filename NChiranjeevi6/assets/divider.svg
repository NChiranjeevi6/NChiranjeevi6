<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20" role="img" aria-label="divider" font-family="'Courier New',Consolas,Menlo,monospace"><defs><linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd24a"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e63900"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a130c" stroke-width=".6"/></pattern></defs><defs><linearGradient id="seg" x1="0" x2="1"><stop offset="0" stop-color="#ff6a00" stop-opacity="0"/><stop offset=".5" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></linearGradient></defs>
<line x1="0" x2="1000" y1="10" y2="10" stroke="#3a1a10" stroke-width="2"/><rect y="8" width="220" height="4" fill="url(#seg)"><animate attributeName="x" values="-220;1000" dur="3.5s" repeatCount="indefinite"/></rect>
<path d="M500 2 L508 10 L500 18 L492 10Z" fill="#ff6a00" filter="url(#glow)"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></path></svg>